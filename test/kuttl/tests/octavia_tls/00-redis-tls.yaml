    MIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQC1testkeyfortest
    ingpurposesonlynotvalidforrealuse1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZa
    bcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdef
    ghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ
    -----END PRIVATE KEY-----
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    MIIDXTCCAkWgAwIBAgIUVLiMY8NRqYWmF7p/w0wl1jPpYkgwDQYJKoZIhvcNAQEL
    BQAwPjELMAkGA1UEBhMCVVMxCzAJBgNVBAgMAkNBMQ8wDQYDVQQHDAZJcnZpbmUx
    ETAPBgNVBAoMCFJlZGlzIENBMB4XDTI0MDEwMTAwMDAwMFoXDTI1MDEwMTAwMDAw
