---
# Create Redis instance WITH TLS for octavia_tls test
# This tests that Redis TLS detection works when Redis has TLS configured
apiVersion: redis.openstack.org/v1beta1
kind: Redis
metadata:
  name: octavia-redis
spec:
  replicas: 1
  # Configure TLS
  tls:
    secretName: redis-tls-certs
  storageRequest: 1G
---
# TLS secret for Redis (matches the format expected by Redis operator)
apiVersion: v1
kind: Secret
metadata:
  name: redis-tls-certs
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    MIIDXTCCAkWgAwIBAgIUVLiMY8NRqYWmF7p/w0wl1jPpYkgwDQYJKoZIhvcNAQEL
