---

# project template to be used locally for operator testing
- project-template:
    name: octavia-operator-s2i-testing
    github-check:
      jobs:
        - octavia-s2i-content-provider
        - octavia-s2i-test:
            dependencies:
              - openstack-k8s-operators-content-provider
              - octavia-s2i-content-provider

# project template to be used in the s2i repository
- project-template:
    name: octavia-operator-s2i-component-jobs
    description: That job that runs with s2i content on octavia-operator changes
    github-check:
      jobs:
        - octavia-s2i-test:
            vars:
              content_provider_registry_ip: "{{ s2i_content_provider_registry_ip }}"
            files:
              - ^containers/base/
              - ^containers/octavia/
            dependencies:
              - s2i-openstack-container-content-provider
              - s2i-openstack-container-consumer-smoke

- project:
    name: openstack-k8s-operators/octavia-operator
    templates:
      - octavia-operator-s2i-testing
    github-check:
      jobs:
        - openstack-k8s-operators-content-provider:
            vars:
              cifmw_install_yamls_sdk_version: v1.41.1
